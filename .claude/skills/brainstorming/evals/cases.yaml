# Eval cases for the `brainstorming` skill.
# Two kinds of case:
#   - trigger_cases:   does the frontmatter `description` fire on the right prompts?
#                      (run_evals.py checks these with a transparent keyword heuristic)
#   - behavioral_cases: given it fired, does the body guide the right behavior?
#                      (these require Claude/human judgment — the runner only lists them)

skill: brainstorming

# The description should keep these substrings — guards against scope creep back
# into spec-writing/implementation.
description_must_contain:
  - "creative work"
  - "out of scope"

# Transparent heuristic used by run_evals.py to approximate triggering.
# A prompt is judged to FIRE when it hits a fire_keyword and no block_keyword.
# Tune these lists as the skill evolves.
heuristic:
  fire_keywords:
    [feature, build, building, component, add, adding, functionality,
     create, creating, design, modify, behavior, agregar, crear, construir, nueva]
  block_keywords:
    [fix, typo, failing, debug, error, bug, rename, "run tests", "why is"]

trigger_cases:
  - id: T1
    prompt: "Quiero agregar una feature para categorizar gastos automáticamente"
    should_fire: true
  - id: T2
    prompt: "Let's build a monthly budget report component"
    should_fire: true
  - id: T3
    prompt: "Fix the typo in CLAUDE.md"
    should_fire: false
  - id: T4
    prompt: "Why is this vitest test failing?"
    should_fire: false
  - id: T5
    prompt: "Add a --verbose flag to the CLI"
    should_fire: true
    note: "weak signal — tiny change; correct firing relies on the anti-pattern section"

behavioral_cases:
  - id: B1
    scenario: "A trivially simple change is requested"
    expect: "Still presents a short design and gets approval (per the 'Too Simple' anti-pattern)"
  - id: B2
    scenario: "Massive multi-subsystem request (bank sync + ML categorization + mobile + reports)"
    expect: "Flags scope, decomposes into sub-projects, brainstorms only the first"
  - id: B3
    scenario: "The idea raises several open questions at once"
    expect: "Asks one question per message, multiple-choice when possible"
  - id: B4
    scenario: "User says 'just skip the design and write the code'"
    expect: "Holds the HARD-GATE; does not implement inside the skill"
  - id: B5
    scenario: "The design is approved"
    expect: "Stops cleanly at the approved design; does not write a spec or code"
